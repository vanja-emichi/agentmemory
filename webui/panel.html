<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentMemory</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg, #1a1a1a); color: var(--fg, #eee); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #333; align-items: center; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 140px; padding: 4px 8px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; }
  button { padding: 4px 10px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  button:hover { background: #333; }
  button:disabled { opacity: .5; cursor: default; }
  .health { font-size: 11px; padding: 2px 8px; border-radius: 8px; border: 1px solid #444; white-space: nowrap; }
  .health.ok { color: #4caf50; border-color: #4caf5066; }
  .health.bad { color: #f44336; border-color: #f4433666; }
  .health.warn { color: #ff9800; border-color: #ff980066; }
  .content { overflow-y: auto; padding: 8px 10px; height: calc(100vh - 49px); }
  .err { font-size: 12px; opacity: .85; padding: 6px 0; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin: 8px 0 6px; }
  .card { border: 1px solid #333; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .card .meta { font-size: 11px; opacity: .7; }
  .card .date { font-size: 10px; opacity: .5; }
  .card .body { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .card .tags { margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
  .card .tag { font-size: 10px; opacity: .6; border: 1px solid #333; border-radius: 4px; padding: 0 4px; }
  .empty { font-size: 12px; opacity: .6; padding: 2px 0; }
</style>
</head>
<body>
<div class="toolbar">
  <input id="q" type="text" placeholder="search memories…">
  <button id="searchBtn">Search</button>
  <button id="refreshBtn" title="Refresh">&#8635;</button>
  <span class="health" id="health">…</span>
</div>
<div class="content" id="content"></div>
<script>
(async function () {
  const q = document.getElementById("q");
  const content = document.getElementById("content");
  const healthEl = document.getElementById("health");
  let csrfToken = null;

  async function getCsrf() {
    if (csrfToken) return csrfToken;
    const res = await fetch("/api/csrf_token", { credentials: "same-origin" });
    if (!res.ok) throw new Error("csrf " + res.status);
    const data = await res.json();
    csrfToken = data.token;
    return csrfToken;
  }

  async function apiGet(path) {
    const token = await getCsrf();
    const res = await fetch("/api/plugins/agentmemory/proxy?path=" + encodeURIComponent(path), {
      headers: { "X-CSRF-Token": token },
      credentials: "same-origin",
    });
    if (!res.ok) throw new Error(res.status + ": " + (await res.text()).slice(0, 160));
    return res.json();
  }

  async function apiSearch(query) {
    const token = await getCsrf();
    const res = await fetch("/api/plugins/agentmemory/proxy?path=search", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": token },
      credentials: "same-origin",
      body: JSON.stringify({ body: { query: query, limit: 25, format: "full" } }),
    });
    if (!res.ok) throw new Error(res.status + ": " + (await res.text()).slice(0, 160));
    return res.json();
  }

  function shortDate(v) {
    if (!v) return "";
    try {
      const d = new Date(v);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  function cardEl(top, date, body, tags) {
    const card = document.createElement("div");
    card.className = "card";
    const topRow = document.createElement("div");
    topRow.className = "top";
    const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = top;
    const dt = document.createElement("span"); dt.className = "date"; dt.textContent = date;
    topRow.append(meta, dt);
    const bodyEl = document.createElement("div"); bodyEl.className = "body"; bodyEl.textContent = body;
    card.append(topRow, bodyEl);
    if (tags && tags.length) {
      const tagsEl = document.createElement("div"); tagsEl.className = "tags";
      for (const t of tags.slice(0, 8)) {
        const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = t;
        tagsEl.appendChild(tag);
      }
      card.appendChild(tagsEl);
    }
    return card;
  }

  function setHealth(h) {
    healthEl.className = "health " + (h === null ? "bad" : h === "healthy" ? "ok" : "warn");
    healthEl.textContent = h === null ? "offline" : (h || "unknown");
  }

  async function load() {
    content.innerHTML = "";
    try {
      const health = await apiGet("health").catch(() => null);
      setHealth(health ? health.status : null);
      if (!health) {
        const err = document.createElement("div");
        err.className = "err";
        err.textContent = "AgentMemory server unreachable";
        content.appendChild(err);
        return;
      }
      const memories = (await apiGet("memories").catch(() => null)) || {};
      const sessions = (await apiGet("sessions").catch(() => null)) || {};

      const h3m = document.createElement("h3"); h3m.textContent = "Memories";
      content.appendChild(h3m);
      const mems = memories.memories || [];
      if (!mems.length) {
        const d = document.createElement("div"); d.className = "empty"; d.textContent = "no memories saved yet";
        content.appendChild(d);
      }
      for (const m of mems) {
        const body = m.content || (m.facts || []).join("\n") || "";
        content.appendChild(cardEl((m.type || "fact") + (m.strength != null ? " · str " + m.strength : ""), shortDate(m.createdAt), body, m.concepts));
      }

      const h3s = document.createElement("h3"); h3s.textContent = "Sessions";
      content.appendChild(h3s);
      const sess = sessions.sessions || [];
      if (!sess.length) {
        const d = document.createElement("div"); d.className = "empty"; d.textContent = "no sessions captured yet";
        content.appendChild(d);
      }
      for (const s of sess.slice(0, 20)) {
        const bits = [];
        if (s.project) bits.push(s.project);
        if (s.startedAt) bits.push(shortDate(s.startedAt));
        if (s.status) bits.push(s.status);
        content.appendChild(cardEl(s.id, (s.observationCount || 0) + " obs", bits.join(" · "), null));
      }
    } catch (err) {
      setHealth(null);
      const d = document.createElement("div"); d.className = "err"; d.textContent = "error: " + err.message;
      content.appendChild(d);
    }
  }

  async function search() {
    const query = q.value.trim();
    if (!query) return;
    content.innerHTML = "";
    try {
      const data = await apiSearch(query);
      const h3 = document.createElement("h3"); h3.textContent = "Search results";
      content.appendChild(h3);
      const rows = data.results || [];
      if (!rows.length) {
        const d = document.createElement("div"); d.className = "empty"; d.textContent = 'no results for "' + query + '"';
        content.appendChild(d);
        return;
      }
      for (const r of rows) {
        const o = r.observation || {};
        const body = o.narrative || (o.facts || []).join("\n") || "";
        content.appendChild(cardEl((o.type || "memory") + " · score " + Number(r.score || 0).toFixed(2), shortDate(o.timestamp), body, o.concepts));
      }
    } catch (err) {
      const d = document.createElement("div"); d.className = "err"; d.textContent = "error: " + err.message;
      content.appendChild(d);
    }
  }

  document.getElementById("searchBtn").addEventListener("click", search);
  document.getElementById("refreshBtn").addEventListener("click", load);
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
  load();
})();
</script>
</body>
</html>
