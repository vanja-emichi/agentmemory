<div
  class="right-canvas-surface-panel agentmemory-canvas-surface"
  data-surface-id="agentmemory"
  :class="{
    'is-active': $store.rightCanvas?.isSurfaceVisible('agentmemory'),
    'is-mounted': $store.rightCanvas?.isSurfaceRendered('agentmemory')
  }"
  :aria-hidden="(!$store.rightCanvas?.isSurfaceVisible('agentmemory')).toString()"
>
  <div
    class="agentmemory-panel"
    style="width: 100%; height: 100%; overflow: hidden"
  >
    <iframe
      src="/api/plugins/agentmemory/viewer"
      style="
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: var(--background, #111);
      "
      title="AgentMemory viewer dashboard"
      allow="clipboard-write"
      referrerpolicy="same-origin"
    ></iframe>
  </div>
</div>
